<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeZone Converter | Meeting planner for distributed teams</title>
    <meta name="description" content="A fast, keyboard-driven timezone converter and meeting planner. Compare cities, plan across timezones on a visual timeline, and share a link with your team.">
    <meta name="theme-color" content="#6366f1">

    <meta property="og:type" content="website">
    <meta property="og:title" content="TimeZone Converter">
    <meta property="og:description" content="Compare timezones, plan meetings on a visual timeline, and share a link with your team.">

    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="manifest" href="/manifest.webmanifest">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

    <script>
      // Applied synchronously (before first paint) to avoid a flash of the wrong theme.
      // "system" mode leaves data-theme unset so the prefers-color-scheme CSS takes over.
      (function () {
        try {
          var t = JSON.parse(localStorage.getItem('cs_sov_theme'));
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
</head>
<body>

<div class="wrapper">
    <header>
        <button class="brand" id="brandBtn" aria-label="Reset to current time">
            <span class="brand-icon"><i data-lucide="globe"></i></span>
            <span class="brand-text">TimeZone Converter</span>
        </button>
        <div class="toolbar">
            <div class="segmented" id="viewToggle" role="group" aria-label="View mode">
                <button type="button" data-view="cards"><i data-lucide="layout-grid"></i>Cards</button>
                <button type="button" data-view="timeline"><i data-lucide="gantt-chart-square"></i>Timeline</button>
            </div>
            <button class="tool-btn" id="formatBtn" aria-label="Toggle 12/24 hour format">24-HOUR</button>
            <button class="tool-btn icon-only" id="shareBtn" title="Copy shareable link" aria-label="Copy shareable link"><i data-lucide="link-2"></i></button>
            <button class="tool-btn icon-only" id="exportBtn" title="Export to calendar" aria-label="Export to calendar"><i data-lucide="calendar-plus"></i></button>
            <button class="tool-btn icon-only" id="themeBtn" title="Toggle theme" aria-label="Toggle theme"><i data-lucide="moon"></i></button>
            <button class="tool-btn icon-only" id="settingsBtn" title="Settings" aria-label="Open settings"><i data-lucide="settings"></i></button>
        </div>
    </header>

    <div class="search-area">
        <div class="search-bar">
            <i data-lucide="search"></i>
            <input type="text" id="mainSearch" placeholder="Search city, timezone, or run a quick action..." autocomplete="off">
            <span class="kbd-hint">Ctrl K</span>
            <button class="btn-current" id="currentTimeBtn"><i data-lucide="zap"></i><span>Now</span></button>
        </div>
        <div id="dropdown" class="dropdown" role="listbox"></div>
    </div>

    <div id="cardsList" class="cards-list"></div>
    <div id="timelineWrap" style="display:none"></div>
</div>

<footer>
    <span class="footer-tag">Designed &amp; Engineered by <b>revanth</b> &copy; 2026</span>
</footer>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
